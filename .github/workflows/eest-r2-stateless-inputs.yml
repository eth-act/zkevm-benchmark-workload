name: EEST R2 Stateless Fixtures

on:
  workflow_dispatch:
    inputs:
      catalog_url:
        description: Public R2 catalog root, index.html URL, or manifest.json URL
        required: false
        default: https://pub-afa6b160acfb4919bda1d0e2a00b5b77.r2.dev/testnets/sepolia/index.html
        type: string
      eest_ref:
        description: ethereum/execution-specs ref to validate with
        required: false
        default: tests-zkevm@v21.0.1
        type: string
      batch_count:
        description: Number of latest complete batches to validate
        required: false
        default: "1"
        type: string
      max_artifacts:
        description: Stop after this many artifacts, or `all` to validate whole batches and their manifests
        required: false
        default: "20"
        type: string
  # TODO(tests-zkevm@v21): restore `schedule: [{ cron: "23 */2 * * *" }]` once Sepolia batches
  # exist in R2. The schedule is paused because the devnet-8 artifacts use the tests-zkevm@v0.8.4
  # input layout, which v21 validation rejects.

permissions:
  contents: read

concurrency:
  group: eest-r2-stateless-inputs-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Latest R2 Batch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CATALOG_URL: ${{ github.event.inputs.catalog_url || 'https://pub-afa6b160acfb4919bda1d0e2a00b5b77.r2.dev/testnets/sepolia/index.html' }}
      EEST_REF: ${{ github.event.inputs.eest_ref || 'tests-zkevm@v21.0.1' }}
      BATCH_COUNT: ${{ github.event.inputs.batch_count || '1' }}
      MAX_ARTIFACTS: ${{ github.event.inputs.max_artifacts || '20' }}
      SUMMARY_DIR: workload/target/eest-r2-stateless-inputs
    steps:
      - name: Checkout workload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: workload
          persist-credentials: false

      - name: Checkout EEST
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ethereum/execution-specs
          ref: ${{ env.EEST_REF }}
          path: execution-specs
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Resolve EEST commit
        id: eest
        run: echo "commit=$(git -C execution-specs rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate R2 stateless fixtures with EEST
        env:
          EEST_COMMIT: ${{ steps.eest.outputs.commit }}
          # Stream progress to the log instead of buffering it until exit.
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p "$SUMMARY_DIR"
          limit_args=()
          if [ "$MAX_ARTIFACTS" != "all" ]; then
            limit_args=(--max-artifacts "$MAX_ARTIFACTS")
          fi
          uv run --project execution-specs --with zstandard \
            python workload/scripts/validate-r2-stateless-inputs-with-eest.py \
              --catalog-url "$CATALOG_URL" \
              --batch-count "$BATCH_COUNT" \
              "${limit_args[@]}" \
              --summary-json "$SUMMARY_DIR/summary.json" \
              --summary-md "$SUMMARY_DIR/summary.md" \
              --eest-ref "$EEST_REF" \
              --eest-commit "$EEST_COMMIT"

      - name: Append summary
        if: always()
        run: |
          if [ -f "$SUMMARY_DIR/summary.md" ]; then
            cat "$SUMMARY_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No validation summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eest-r2-stateless-inputs-summary
          path: |
            ${{ env.SUMMARY_DIR }}/summary.json
            ${{ env.SUMMARY_DIR }}/summary.md
          if-no-files-found: warn
